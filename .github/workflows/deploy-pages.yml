name: Deploy KMSA Management System

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify v5.1 project follow-up invariants
        run: node ../../scripts/v5-followup-check.mjs
      - name: Verify v5.4 clear project tracking and notifications
        run: node ../../scripts/v5-4-check.mjs
      - name: Verify v5.5 review versions and supervision navigation
        run: node ../../scripts/v5-5-check.mjs
      - name: Verify v5.8 cycle and import invariants
        run: node ../../scripts/v5-8-check.mjs
      - name: Verify v5.9 administration, batches and cycle separation
        run: node ../../scripts/v5-9-check.mjs
      - name: Verify v6 integration and safety
        run: node ../../scripts/v6-integration-check.mjs
      - name: Verify v6.1 administration redesign
        run: node ../../scripts/v6-1-check.mjs
      - name: Verify v6.2 office eligibility and CSV synchronization
        run: node ../../scripts/v6-2-check.mjs
      - name: Verify v6.3 office role and unassigned cohort safeguards
        run: node ../../scripts/v6-3-check.mjs
      - name: Verify v6.4 review ledger compatibility
        run: node ../../scripts/v6-4-check.mjs
      - name: Verify v6.4 review flow simulation
        run: node ../../scripts/v6-4-flow-smoke.mjs
      - name: Verify v6.6 notifications, actions and interface
        run: node ../../scripts/v6-6-check.mjs
      # Deprecated v5/v7 checks asserted the old 12h and mandatory action flows.
      # The v7.2 suite is the authoritative project invariant suite; compatible older checks remain above.
      - name: Verify final project flow v7.2 (24h, deadlines, lifecycle, safety)
        run: node ../../scripts/check-projects-v7-2.mjs
      - name: Verify project and supervision v7.3 (four-role operations)
        run: node ../../scripts/check-projects-v7-3.mjs
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CYCLE_LABEL: KMSA 28
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
