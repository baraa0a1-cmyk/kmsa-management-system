name: Deploy KMSA Management System

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify v5 monitoring invariants
        run: node ../../scripts/v5-static-check.mjs
      - name: Verify v5.1 project follow-up invariants
        run: node ../../scripts/v5-followup-check.mjs
      - name: Verify v5.2 delegated supervision and deadlines
        run: node ../../scripts/v5-2-check.mjs
      - name: Verify v5.3 quality review and full project history
        run: node ../../scripts/v5-3-check.mjs
      - name: Verify v5.4 clear project tracking and notifications
        run: node ../../scripts/v5-4-check.mjs
      - name: Verify v5.5 review versions and supervision navigation
        run: node ../../scripts/v5-5-check.mjs
      - name: Verify v5.6 lifecycle and delegated supervision
        run: node ../../scripts/v5-6-check.mjs
      - name: Verify v5.7 review requests and project decisions
        run: node ../../scripts/v5-7-check.mjs
      - name: Verify v5.8 cycle and import invariants
        run: node ../../scripts/v5-8-check.mjs
      - name: Verify v5.9 administration, batches and cycle separation
        run: node ../../scripts/v5-9-check.mjs
      - name: Verify v6 integration and safety
        run: node ../../scripts/v6-integration-check.mjs
      - name: Verify v6.1 administration redesign
        run: node ../../scripts/v6-1-check.mjs
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CYCLE_LABEL: KMSA 28
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
